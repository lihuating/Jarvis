    embedding: default-text-embedding
    reranker: default-text-reranker
    use_bm25: true
    use_rerank: true
  code:
    embedding: default-code-embedding
    reranker: ''
replace_map: {}
SHELL: /bin/bash
conversation_turn_threshold: 200
diff_visualization_mode: side_by_side
diff_show_line_numbers: true
diff_large_file_threshold: 300
# CodeAgent（jca）在工具调用后是否在终端展示“整段工作区 git diff”。
# 关闭后仍会执行影响分析、构建验证与静态分析；仅减少终端输出噪音。
code_agent_show_git_diff: false
enable_llm_auto_model_selection: true
enable_llm_auto_smart_model_selection: false   # 默认：不自动用 smart；要大任务自动 smart 时改为 true
llm_auto_model_small_task_token_threshold: 800
llm_auto_model_large_task_token_threshold: 4000
