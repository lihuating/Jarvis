[package]
name = "jarvis-rust-tools"
version = "0.1.0"
edition = "2021"
authors = ["Jarvis Team"]
license = "MIT"
description = "Rust-optimized performance modules for Jarvis"

[lib]
name = "jarvis_rust_tools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.15", features = ["extension-module"] }
regex = "1.5"
memmap2 = "0.5"
lazy_static = "1.4"
md5 = "0.7"